<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <title>Registro de Actividades</title>
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
    >
  </head>
  <body>
    <header>
      <h1>Comunidad DCC</h1>
      <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/registrar_miembro}">Registro Miembros</a>
        <a th:href="@{/registrar_actividad}">Registro Actividades</a>
        <a th:href="@{/listado}">Listado Actividades</a>
        <a th:href="@{/estadisticas}">Estadísticas</a>
        <a th:href="@{/buscador}">Buscador</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Registrar Nueva Actividad</h2>
        <p>
          Registra una nueva actividad que vayas a realizar. Los campos marcados
          con (*) son obligatorios.
        </p>

        <!--Errores que Spring rechaza-->
        <div th:if="${not #lists.isEmpty(errores)}" style="color: red; margin-bottom: 15px">
          <ul>
            <li th:each="error : ${errores}" th:text="${error}"></li>
          </ul>
        </div>

        <!--Errores de JS-->
        <div
          id="errores-js"
          style="
            color: red;
            white-space: pre-line;
            margin-bottom: 15px;
            font-weight: bold;
          "
        ></div>

        <form
          th:action="@{/registrar_actividad}"
          method="POST"
          enctype="multipart/form-data"
          id="form-actividad"
        >
          <label for="miembro-act">Seleccione el Miembro (*)</label>
          <select id="miembro-act" name="miembro_id" required>
            <option value="">Selecciona tu nombre</option>
            <option th:each="m : ${miembros}" th:value="${m.id}" th:text="${m.nombre}"></option>
          </select>

          <label for="nombre-act">Nombre de la Actividad (*)</label>
          <input type="text" id="nombre-act" name="nombre_actividad" required>

          <label for="categoria-act">Categoría de la actividad (*)</label>
          <select id="categoria-act" name="categoria" required>
            <option value="">Selecciona una categoria</option>
            <option value="arte" th:selected="${categoriaActual == 'arte'}">Artística</option>
            <option value="deporte" th:selected="${categoriaActual == 'deporte'}">Deportiva</option>
            <option value="tecnología" th:selected="${categoriaActual == 'tecnología'}">Tecnológica</option>
            <option value="social" th:selected="${categoriaActual == 'social'}">Social</option>
            <option value="recreativa" th:selected="${categoriaActual == 'recreativa'}">Recreativa</option>
            <option value="otra" th:selected="${categoriaActual == 'otra'}">Otra</option>
          </select>

          <label for="dias-act">Día de la semana (*)</label>
          <select id="dias-act" name="dia" required>
            <option value="">Selecciona un día</option>
            <option value="lunes" th:selected="${diaActual == 'lunes'}">Lunes</option>
            <option value="martes" th:selected="${diaActual == 'martes'}">Martes</option>
            <option value="miércoles" th:selected="${diaActual == 'miércoles'}">Miércoles</option>
            <option value="jueves" th:selected="${diaActual == 'jueves'}">Jueves</option>
            <option value="viernes" th:selected="${diaActual == 'viernes'}">Viernes</option>
            <option value="sábado" th:selected="${diaActual == 'sábado'}">Sábado</option>
            <option value="domingo" th:selected="${diaActual == 'domingo'}">Domingo</option>
          </select>

          <label for="hora-act">Hora de inicio (*)</label>
          <input id="hora-act" name="hora_inicio" type="time" required>

          <label for="horas-act">Horas semanales dedicadas (*)</label>
          <input id="horas-act" name="duracion" type="number" required>

          <label for="archivos-act">Foto o video (*)</label>
          <input
            id="archivos-act"
            name="archivos"
            type="file"
            multiple
            accept="image/*,video/*"
          >

          <label for="link-act">Enlace relacionado (Opcional)</label>
          <input id="link-act" name="link_relacionado" type="text">

          <button type="button" id="btn-actividad">Guardar Actividad</button>
        </form>
      </section>
    </main>

    <script th:src="@{/js/actividades.js}"></script>
  </body>
</html>
