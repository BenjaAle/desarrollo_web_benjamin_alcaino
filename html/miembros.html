<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registro de Miembros</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Comunidad DCC</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="miembros.html">Registro Miembros</a>
            <a href="actividades.html">Registro Actividades</a>
            <a href="listado.html">Listado Actividades</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registro de Nuevo Miembro</h2>
            <p>Ingresa tus datos para ingresar. Todos los campos son obligatorios.</p>
            
            <form id="form-miembro">
                <label for="nombre-miembro">Nombre completo</label>
                <input id="nombre-miembro" type="text">
                
                <label for="email-miembro">Correo electrónico</label>
                <input id="email-miembro" type="email">
                
                <label for="tipo-miembro">Tipo de miembro</label>
                <select id="tipo-miembro">
                    <option value="">Selecciona una opción</option>
                    <option value="Estudiante">Estudiante Pre/Post grado</option>
                    <option value="Academico">Académico</option>
                    <option value="Funcionario">Funcionario</option>
                </select>

                <div id="datos-extra"></div>
                <button type="button" id="btn-miembro">Registrar Miembro</button>
            </form>
        </section>
    </main>

    <script src="../js/miembros.js"></script>
</body>
</html>
