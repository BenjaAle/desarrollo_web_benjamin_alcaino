<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registro de Actividades</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Comunidad DCC</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="miembros.html">Registro Miembros</a>
            <a href="actividades.html">Registro Actividades</a>
            <a href="listado.html">Listado Actividades</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registrar Nueva Actividad</h2>
            <p>Registra una nueva actividad que vayas a realizar. Los campos marcados con (*) son obligatorios.</p>
            
            <form id="form-actividad">
                <label for="categoria-act">Categoría de la actividad (*)</label>
                <select id="categoria-act">
                    <option value="">Selecciona una categoria</option>
                    <option value="Artistica">Artística</option>
                    <option value="Deportiva">Deportiva</option>
                    <option value="Tecnologica">Tecnológica</option>
                    <option value="Social">Social</option>
                    <option value="Recreativa">Recreativa</option>
                </select>

                <label for="dias-act">Días de la semana (*)</label>
                <input id="dias-act" type="text">

                <label for="horas-act">Horas semanales dedicadas (*)</label>
                <input id="horas-act" type="number">

                <label for="archivos-act">Foto o video (*)</label>
                <input id="archivos-act" type="file" multiple accept="image/*,video/*">

                <label for="link-act">Enlace relacionado (Opcional)</label>
                <input id="link-act" type="text">
                <button type="button" id="btn-actividad">Guardar Actividad</button>
            </form>
        </section>
    </main>

    <script src="../js/actividades.js"></script>
</body>
</html>
