<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Detalle de Actividad</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <header>
      <h1>Comunidad DCC</h1>
      <nav>
        <a href="listado.html">Volver al Listado</a>
      </nav>
    </header>

    <main>
      <section class="center-text">
        <h2 id="det-actividad">Cargando...</h2>
        <h3 id="det-nombre" style="color: #666">Cargando...</h3>
        <p id="det-categoria"></p>
        <img
          id="det-foto"
          src="#"
          alt="Evidencia"
          style="max-width: 300px; margin: 20px 0"
        >
        <p>Días y horarios: Lunes y Miércoles, 4 horas por semana</p>
      </section>
    </main>

    <script>
      //Mismos datos que en listado.js
      const actividades = [
        {
          id: 1,
          nombre: "Benjamin Alcaino",
          actividad: "Ajedrez",
          categoria: "Recreativa",
          foto: "ajedrez.avif",
        },
        {
          id: 2,
          nombre: "Jose Miguel",
          actividad: "Pintura",
          categoria: "Artistica",
          foto: "pintura.avif",
        },
        {
          id: 3,
          nombre: "Amaranta Espinoza",
          actividad: "Fútbol",
          categoria: "Deportiva",
          foto: "futbol.avif",
        },
        {
          id: 4,
          nombre: "Matias Cifuentes",
          actividad: "Taller de Robótica",
          categoria: "Tecnologica",
          foto: "robot.avif",
        },
        {
          id: 5,
          nombre: "Joaquin Figueroa",
          actividad: "Club de Lectura",
          categoria: "Social",
          foto: "libro.avif",
        },
      ];

      //Leer el ID de la URL (obtener lo que viene después de "?")
      const urlParams = new URLSearchParams(window.location.search);
      const idBuscado = parseInt(urlParams.get("id"));

      //Buscar la actividad en el arreglo
      const act = actividades.find((a) => a.id === idBuscado);

      if (act) {
        //Rellenar el html con los datos de la actividad encontrada
        document.getElementById("det-actividad").innerText = act.actividad;
        document.getElementById("det-nombre").innerText =
          "Registrado por: " + act.nombre;
        document.getElementById("det-categoria").innerText =
          "Categoría: " + act.categoria;
        document.getElementById("det-foto").src = "../imagenes/" + act.foto;
      } else {
        document.getElementById("det-actividad").innerText =
          "Actividad no encontrada";
      }
    </script>
  </body>
</html>
